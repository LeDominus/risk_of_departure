services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_artifacts:/mlflow/artifacts
      - ./mlflow_data:/mlflow/data
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/data/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    restart: unless-stopped

