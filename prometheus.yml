global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fastapi-churn-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:1111"]
        labels:
          service: "risk-of-departure"

  - job_name: "evidently-monitor"
    static_configs:
      - targets: ["evidently-monitor:8000"]
        labels:
          service: "risk-of-departure"
          component: "evidently"